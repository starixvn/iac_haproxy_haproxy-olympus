### Fanex.Mail.Service
frontend olympus_Fanex.Mail.Service_fe
bind *:8787
mode tcp
log global
option tcplog
option tcp-check
default_backend olympus_Fanex.Mail.Service_be

backend olympus_Fanex.Mail.Service_be
mode tcp
balance source
server 10.2.190.81_tcp_8787 10.2.190.81:8787 check 
server 10.2.190.82_tcp_8787 10.2.190.82:8787 check backup

### NAP.API
frontend olympus_NAP.API_fe
bind *:1710
mode tcp
log global
option tcplog
option tcp-check
default_backend olympus_NAP.API_be

backend olympus_NAP.API_be
mode tcp
balance roundrobin
server 10.2.190.81_tcp_1710 10.2.190.81:1710 check 
server 10.2.190.82_tcp_1710 10.2.190.82:1710 check 
