

backend olympus_nap_risk_control_UAT_2_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/n2[/]?,/)]
    server-template nap_risk_control_UAT_2_ 1 nap_risk_control_UAT_2:5000 check resolvers docker init-addr none

