

backend olympus_nap_risk_control_UAT_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /Home/HealthCheck
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/main[/]?,/)]
    server-template nap_risk_control_UAT_ 1 nap_risk_control_UAT:5000 check resolvers docker init-addr none

backend olympus_nap_risk_control_UAT_1_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /Home/HealthCheck
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/n1[/]?,/)]
    server-template nap_risk_control_UAT_1_ 1 nap_risk_control_UAT_1:5000 check resolvers docker init-addr none
