

backend olympus_nap_mail_downloadfile_UAT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /Home/HealthCheck
    http-check expect status 200
    server-template nap_mail_downloadfile_UAT_ 1 nap_mail_downloadfile_UAT:5000 check resolvers docker init-addr none

