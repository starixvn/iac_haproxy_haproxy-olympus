backend olympus_nap_settlement_UAT_3_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    server-template nap_settlement_UAT_3_ 1 nap_settlement_UAT_3:5000 check resolvers docker init-addr none

