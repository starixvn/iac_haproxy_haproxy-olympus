backend olympus_nap_settlement_UAT_1_be
    balance source
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_settlement_UAT_1_ 1 nap_settlement_UAT_1:5000 check resolvers docker init-addr none

