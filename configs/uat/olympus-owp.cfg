frontend olympus_nap_owp_UAT_1_fe
    bind *:7319
    mode  http
    option forwardfor
    option http-keep-alive
default_backend olympus_nap_owp_UAT_1_be

backend olympus_nap_owp_UAT_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.2.190.88_7500 10.2.190.88:7500 check
    server 10.2.190.89_7500 10.2.190.89:7500 check

backend olympus_nap_owp_UAT_1_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/n1/,/)]
    server-template nap_owp_UAT_1_ 1 nap_owp_UAT_1:5000 check resolvers docker init-addr none

