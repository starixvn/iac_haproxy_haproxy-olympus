frontend olympus_nap_special_delete_UAT_fe
    bind *:6345
    mode  http
    use_backend olympus_nap_special_delete_UAT_be

backend olympus_nap_special_delete_UAT_be
    option forwardfor
    option http-server-close
    timeout http-keep-alive 30s
    option httpchk GET /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.2.190.88_7307 10.2.190.89:7307 check
    server 10.2.190.89_7307 10.2.190.89:7307 check

backend olympus_nap_tvs_website_UAT_1_path_be
    option forwardfor
    cookie serverid insert
    balance source
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/n1[/]?,/)]
    server-template nap_tvs_website_UAT_1_ 2 nap_tvs_website_UAT_1:5000 check resolvers docker init-addr none

backend olympus_nap_tvs_website_UAT_2_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/n2[/]?,/)]
    server-template nap_tvs_website_UAT_2_ 1 nap_tvs_website_UAT_2:5000 check resolvers docker init-addr none

backend olympus_nap_tvs_website_UAT_3_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/n3[/]?,/)]
    server-template nap_tvs_website_UAT_3_ 1 nap_tvs_website_UAT_3:5000 check resolvers docker init-addr none

