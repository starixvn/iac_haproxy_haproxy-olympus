frontend olympus_mail_service_UAT_fe
    bind *:8787
    mode tcp
    option dontlog-normal
    option tcplog
    option tcp-check
    use_backend olympus_mail_service_UAT_be

backend olympus_mail_service_UAT_be
    timeout server 10m
    server-template nap_mail_service_UAT_ 1 nap_mail_mail_service_UAT:5000 check resolvers docker init-addr none

frontend olympus_nap_api_netcore_UAT_fe
    bind *:8788
    mode tcp
    option dontlog-normal
    option tcplog
    option tcp-check
    use_backend olympus_nap_api_netcore_UAT_be

