frontend olympus_nap_nap_api_netcore_AWS_fe
    bind *:8788
    mode tcp
    option tcp-check
    option tcplog
    use_backend olympus_nap_nap_api_netcore_AWS_be

backend olympus_nap_nap_api_netcore_AWS_be
    timeout server 10m
    server-template nap_nap_api_netcore_AWS_ 1 nap_nap_api_netcore_AWS:5000 check resolvers docker init-addr none
