###
backend olympus_nap_risk_control_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /Home/HealthCheck
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/main/,/)]
    server-template nap_risk_control_LOCAL_ 1 nap_risk_control_LOCAL:5000 check resolvers docker init-addr none

backend olympus_nap_risk_control_LOCAL_1_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /Home/HealthCheck
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/l1/,/)]
    server-template nap_risk_control_LOCAL_1_ 1 nap_risk_control_LOCAL_1:5000 check resolvers docker init-addr none

