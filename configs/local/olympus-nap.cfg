backend olympus_nap_report_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.18.200.202_7303 10.18.200.202:7303 check
    server 10.18.200.200_7303 10.18.200.209:7303 check

backend olympus_nap_msite2_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template nap_msite2_LOCAL_ 1 nap_msite2_LOCAL:5000 check resolvers docker init-addr none
