
frontend olympus_prms
    bind *:7011 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode  http
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    default_backend olympus_prms_nodes
    
backend olympus_prms_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server-template olympus_prms1 1 10.18.200.202:7301 check
    server-template olympus_prms2 1 10.18.200.209:7301 check
####
backend olympus_prms_netcore_v1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template olympus_netcore_prms_v1_ 1 10.18.200.143:7363 check resolvers docker init-addr none

backend olympus_prms_netcore_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template nap_parlay_rms_LOCAL_ 1 nap_parlay_rms_LOCAL:5000 check resolvers docker init-addr none
