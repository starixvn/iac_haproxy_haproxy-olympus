backend olympus_aa_LOCAL_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template nap_aa_LOCAL_ 1 nap_aa_LOCAL:5000 check resolvers docker init-addr none

