
backend olympus_nap_special_delete_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.18.200.202_7307 10.18.200.202:7307 check
    server 10.18.200.209_7307 10.18.200.209:7307 check


