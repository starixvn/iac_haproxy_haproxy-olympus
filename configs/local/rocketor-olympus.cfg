

backend olympus_nap_risk_control_LOCAL_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/n2[/]?,/)]
    server-template nap_risk_control_LOCAL_ 1 nap_risk_control_LOCAL:5000 check resolvers docker init-addr none

backend olympus_nap_risk_control_LOCAL_1_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/n1[/]?,/)]
    server-template nap_risk_control_LOCAL_1_ 1 nap_risk_control_LOCAL_1:5000 check resolvers docker init-addr none
