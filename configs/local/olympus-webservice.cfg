frontend olympus_mail_service_LOCAL_fe
    bind *:8787 
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
# default_backend olympus_mail_service_LOCAL_be

frontend olympus_nap_api_netcore_LOCAL_fe
    bind *:8788
    mode tcp
    option tcp-check
    option tcplog
    use_backend olympus_nap_nap_api_netcore_LOCAL_be
