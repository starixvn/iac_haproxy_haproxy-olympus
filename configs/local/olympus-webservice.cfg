frontend olympus_mail_service_LOCAL
    bind *:8787 
    mode tcp
    option tcp-check
    option tcplog
    use_backend olympus_mail_service_LOCAL_nodes

backend olympus_mail_service_LOCAL_nodes
    timeout server 10m
    server-template nap_mail_service_LOCAL_ 1 nap_mail_mail_service_LOCAL:5000 check resolvers docker init-addr none

frontend olympus_nap_api_netcore_LOCAL
    bind *:8788
    mode tcp
    option tcp-check
    option tcplog
    use_backend olympus_nap_api_netcore_LOCAL_nodes

backend olympus_nap_api_netcore_LOCAL_nodes
    timeout server 10m
    server-template nap_api_netcore_LOCAL_ 1 nap_nap_api_netcore_LOCAL:5000 check resolvers docker init-addr none
