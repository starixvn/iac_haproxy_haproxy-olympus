frontend olympus_mail_service_LOCAL_fe
    bind *:8787 
    mode tcp
    option tcp-check
    option tcplog
    #use_backend olympus_mail_service_LOCAL_be
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]   
default_backend default_backend_nodes

backend olympus_mail_service_LOCAL_be
    timeout server 10m
    server-template nap_mail_service_LOCAL_ 1 nap_mail_mail_service_LOCAL:5000 check resolvers docker init-addr none

frontend olympus_nap_api_netcore_LOCAL_fe
    bind *:8788
    mode tcp
    option tcp-check
    option tcplog
    use_backend olympus_nap_api_netcore_LOCAL_be

backend olympus_nap_api_netcore_LOCAL_be
    timeout server 10m
    server-template nap_api_netcore_LOCAL_ 1 nap_nap_api_netcore_LOCAL:5000 check resolvers docker init-addr none
