frontend olympus_owp
    bind *:7304 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode  http
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    default_backend olympus_owp_nodes

backend olympus_owp_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server-template olympus_owp1 1 10.18.200.202:7304 check
    server-template olympus_owp2 1 10.18.200.209:7304 check
####

backend olympus_nap_owp_netcore_local_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_owp_LOCAL_ 1 nap_owp_LOCAL:5000 check resolvers docker init-addr none

