frontend olympus_nap_settlement_fe
    bind *:6343 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    ##use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/special-hosts.map)]
    use_backend %[path,map_beg(/etc/haproxy/maps/olympus-proxy.map)] # if { hdr(host) -i settle.nexdev.net }
default_backend default_backend_nodes

backend olympus_nap_settlement_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.18.200.202_7306 10.18.200.202:7306 check
    server 10.18.200.209_7306 10.18.200.209:7306 check

backend olympus_nap_settlement_clonedata_api_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.18.200.202_7316 10.18.200.202:7316 check
    server 10.18.200.209_7316 10.18.200.209:7316 check

#######
