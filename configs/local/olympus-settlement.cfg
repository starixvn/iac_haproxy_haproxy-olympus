backend olympus_nap_settlement_clonedata_api_LOCAL_be
   	option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.18.200.202_7316 10.18.200.202:7316 check
    server 10.18.200.209_7316 10.18.200.209:7316 check

backend olympus_nap_settlement_LOCAL_1_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    server-template nap_settlement_LOCAL_1_ 1 nap_settlement_LOCAL_1:5000 check resolvers docker init-addr none

