##
backend olympus_nap_tvs_aftervoid_service_LOCAL_be
    option forwardfor
    option http-server-close
    #option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/service/,/)]
    server-template nap_tvs_aftervoid_service_LOCAL_ 1 nap_tvs_aftervoid_service_LOCAL:5000 check resolvers docker init-addr none

backend olympus_nap_tvs_aftervoid_service_LOCAL_1_be
    option forwardfor
    option http-server-close
    #option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/service1/,/)]
    server-template nap_tvs_aftervoid_service_LOCAL_1_ 1 nap_tvs_aftervoid_service_LOCAL_1:5000 check resolvers docker init-addr none
