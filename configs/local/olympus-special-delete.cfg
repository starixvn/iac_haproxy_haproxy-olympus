backend olympus_nap_special_delete_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.18.200.202_7307 10.18.200.202:7307 check
    server 10.18.200.209_7307 10.18.200.209:7307 check

###
backend olympus_nap_tvs_website_LOCAL_1_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/N1/,/)]
    server-template nap_tvs_website_LOCAL_1_ 1 nap_tvs_website_LOCAL_1:5000 check resolvers docker init-addr none

