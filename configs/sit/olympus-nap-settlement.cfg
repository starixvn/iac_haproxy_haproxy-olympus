###
frontend olympus_nap_settlement_SIT_fe
    bind *:6343
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    use_backend %[path,map_beg(/etc/haproxy/maps/olympus-proxy-settle.map)] # if { hdr(host) -i settle.playthefun.com }
default_backend default_backend_nodes

backend olympus_nap_settlement_SIT_1_be2
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/n1/,/)]
    server-template nap_settlement_SIT_1_ 1 nap_settlement_SIT_1:5000 check resolvers docker init-addr none

