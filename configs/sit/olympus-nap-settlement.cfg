backend olympus_nap_settlement_SIT_1_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template nap_settlement_SIT_1_ 1 nap_settlement_SIT_1:5000 check resolvers docker init-addr none

