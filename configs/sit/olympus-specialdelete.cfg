frontend olympus_nap_special_delete_SIT_fe
    bind *:6345
    mode  http
    use_backend olympus_nap_special_delete_SIT_be

backend olympus_nap_special_delete_SIT_be
    option forwardfor
    option http-server-close
    timeout http-keep-alive 30s
    #option httpchk GET /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 172.16.4.103_803 172.16.4.103:803 check
    server 172.16.4.105_803 172.16.4.105:803 check

###
backend olympus_nap_tvs_website_SIT_1_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/n1/,/)]
    server-template nap_tvs_website_SIT_1_ 1 nap_tvs_website_SIT_1:5000 check resolvers docker init-addr none

