backend olympus_nap_tvs_website_SIT_1_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/n1[/]?,/)]
    server-template nap_tvs_website_SIT_1_ 1 nap_tvs_website_SIT_1:5000 check resolvers docker init-addr none

