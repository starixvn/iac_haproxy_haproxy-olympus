

backend olympus_nap_parlay_rms_KLDR_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template nap_parlay_rms_KLDR_ 1 nap_parlay_rms_KLDR:5000 check resolvers docker init-addr none

