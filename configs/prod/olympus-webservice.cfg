frontend olympus_mail_service_PROD_fe
    bind *:8787 
    mode tcp
    option tcp-check
    option tcplog
    use_backend olympus_nap_mail_service_PROD_be

backend olympus_nap_mail_service_PROD_be
    timeout server 10m
    mode tcp
    option tcp-check
    option tcplog
    server-template nap_mail_service_PROD_ 1 nap_mail_mail_service_PROD:5000 check resolvers docker init-addr none

frontend olympus_nap_api_netcore_PROD_fe
    bind *:8788
    mode tcp
    option tcp-check
    option tcplog
    use_backend olympus_nap_api_netcore_PROD_be

backend olympus_nap_api_netcore_PROD_be
    timeout server 10m
    mode tcp
    option tcp-check
    option tcplog
    server-template nap_api_netcore_PROD_ 2 nap_nap_api_netcore_PROD:5000 check resolvers docker init-addr none
