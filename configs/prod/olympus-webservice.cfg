frontend olympus_mail_service_PROD
    bind *:8787 
    mode tcp
    option tcp-check
    option tcplog
    use_backend olympus_mail_service_PROD_nodes

backend olympus_mail_service_PROD_nodes
    timeout server 10m
    server-template nap_mail_service_PROD_ 1 nap_mail_mail_service_PROD:5000 check resolvers docker init-addr none

frontend olympus_nap_api_netcore_PROD
    bind *:8788
    mode tcp
    option tcp-check
    option tcplog
    use_backend olympus_nap_api_netcore_PROD_nodes

backend olympus_nap_api_netcore_PROD_nodes
    timeout server 10m
    server-template nap_api_netcore_PROD_ 1 nap_nap_api_netcore_PROD:5000 check resolvers docker init-addr none