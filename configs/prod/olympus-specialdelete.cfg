frontend olympus_nap_special_delete_PROD_fe
    bind *:6345
    mode  http
    use_backend olympus_nap_special_delete_PROD_be

backend olympus_nap_special_delete_PROD_be
    option forwardfor
    option http-server-close
    timeout http-keep-alive 30s
    option httpchk GET /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.2.27.119_7307 10.2.27.119:7307 check
    server 10.2.27.120_7307 10.2.27.120:7307 check

backend olympus_nap_tvs_website_PROD_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/n1/,/)]
    server-template nap_tvs_website_PROD_ 1 nap_tvs_website_PROD:5000 check resolvers docker init-addr none
