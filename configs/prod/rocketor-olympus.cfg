

backend olympus_nap_risk_control_PROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    server-template nap_risk_control_PROD_ 1 nap_risk_control_PROD:5000 check resolvers docker init-addr none

