backend olympus_nap_tvs_website_PROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    http-request set-path %[path,regsub(^/n1/,/)]
    server-template nap_tvs_website_PROD_ 2 nap_tvs_website_PROD:5000 check inter 3s fall 5 rise 5 resolvers docker init-addr none

