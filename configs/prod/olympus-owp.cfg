frontend olympus_nap_owp_PROD_fe
    bind *:8000
    mode  http
    use_backend olympus_nap_owp_PROD_1_be

backend olympus_nap_owp_PROD_1_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_owp_PROD_1_ 1 nap_owp_PROD_1:5000 check resolvers docker init-addr none
