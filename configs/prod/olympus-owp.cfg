frontend olympus_nap_owp_PROD_fe
    bind *:8000
    mode  http
    use_backend olympus_nap_owp_PROD_1_be

backend olympus_nap_owp_PROD_1_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_owp_PROD_1_ 1 nap_owp_PROD_1:5000 check resolvers docker init-addr none

backend olympus_nap_owp_PROD_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.2.27.119_7304 10.2.27.119:7304 check
    server 10.2.27.120_7304 10.2.27.120:7304 check

backend olympus_nap_owp_PROD_1_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/n1/,/)]
    server-template nap_owp_PROD_1_ 1 nap_owp_PROD_1:5000 check resolvers docker init-addr none

backend olympus_nap_owp_PROD_2_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/n2/,/)]
    server-template nap_owp_PROD_2_ 1 nap_owp_PROD_2:5000 check resolvers docker init-addr none
