frontend olympus_nap_owp_PROD
    bind *:8000
    mode  http
    use_backend olympus_nap_owp_PROD_nodes

backend olympus_nap_owp_PROD_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_owp_PROD_ 1 nap_owp_PROD:5000 check resolvers docker init-addr none