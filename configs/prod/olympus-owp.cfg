frontend olympus_nap_owp_PROD_fe2
    bind *:8000
    mode  http
    use_backend olympus_nap_owp_PROD_1_be2

backend olympus_nap_owp_PROD_1_be2
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    cookie serverid insert
    server-template nap_owp_PROD_1_ 1 nap_owp_PROD_1:5000 check resolvers docker init-addr none

backend olympus_nap_owp_PROD_1_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/n1/,/)]
    server-template nap_owp_PROD_1_ 1 nap_owp_PROD_1:5000 check resolvers docker init-addr none

backend olympus_nap_owp1_PROD_be
    option forwardfor
    cookie serverid insert
    option http-keep-alive
    option httpchk GET /healthcheck
    http-check expect status 200
    server-template nap_owp_PROD_1_ 2 nap_owp_PROD_1:5000 check resolvers docker init-addr none



