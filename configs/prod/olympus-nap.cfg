backend olympus_nap_prms_PROD_be
    balance source
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_parlay_rms_PROD_ 1 nap_parlay_rms_PROD:5000 check resolvers docker init-addr none

backend olympus_nap_msite2_PROD_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template nap_msite2_PROD_ 1 nap_msite2_PROD:5000 check resolvers docker init-addr none

