    cookie serverid insert
    http-request set-path %[path,regsub(^/n2/,/)]
    server-template nap_settlement_PROD_2_ 1 nap_settlement_PROD_2:5000 check resolvers docker init-addr none

backend olympus_settle_PROD_be
    option http-server-close
    #option httpchk HEAD /whoami.aspx
    http-check expect status 200
