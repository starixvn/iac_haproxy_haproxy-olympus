backend olympus_nap_settlement_PROD_be2
    option http-server-close
    option httpchk GET /healthcheck
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/n1/,/)]
    server-template nap_settlement_PROD_ 1 nap_settlement_PROD:5000 check inter 12s fall 5 rise 5 resolvers docker init-addr none

backend olympus_nap_settlement_PROD_2_be2
    option http-server-close
